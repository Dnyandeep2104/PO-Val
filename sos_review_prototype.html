<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F5 Sales Operations — PO Validation & Booking Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* F5 Brand & Enterprise Color Palette */
  --f5-navy-900: #0A1628;
  --f5-navy-800: #0F233E;
  --f5-navy-700: #163259;
  --f5-blue-600: #0066FF;
  --f5-blue-700: #0052CC;
  --f5-blue-50: #EFF6FF;
  --f5-red-500: #E11D48;
  --f5-red-50: #FFF1F2;
  
  /* Slate & Neutral Surfaces */
  --bg-app: #F8FAFC;
  --surface-card: #FFFFFF;
  --surface-subtle: #F1F5F9;
  --border-light: #E2E8F0;
  --border-strong: #CBD5E1;
  
  /* Typography */
  --text-heading: #0F172A;
  --text-body: #334155;
  --text-muted: #64748B;
  --text-subtle: #94A3B8;
  
  /* Functional Status Colors */
  --status-success: #059669;
  --status-success-bg: #ECFDF5;
  --status-success-border: #A7F3D0;
  
  --status-warning: #D97706;
  --status-warning-bg: #FFFBEB;
  --status-warning-border: #FDE68A;
  
  --status-danger: #DC2626;
  --status-danger-bg: #FEF2F2;
  --status-danger-border: #FECACA;
  
  --status-info: #0284C7;
  --status-info-bg: #F0F9FF;
  --status-info-border: #BAE6FD;
  
  /* Shadows & Radius */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-card: 0 4px 6px -1px rgba(15, 23, 42, 0.04), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
  --shadow-card-hover: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
  --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-app);
  color: var(--text-body);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- NAVBAR */
.top-navbar {
  background: var(--f5-navy-900);
  color: #FFFFFF;
  padding: 0 28px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--f5-red-500);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(10, 22, 40, 0.15);
}
.brand-area {
  display: flex;
  align-items: center;
  gap: 16px;
}
.f5-logo-container {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  cursor: pointer;
}
.f5-symbol {
  width: 28px;
  height: 28px;
  background: var(--f5-red-500);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 14px;
  color: #FFFFFF;
  letter-spacing: -0.05em;
  box-shadow: 0 2px 8px rgba(225, 29, 72, 0.4);
}
.brand-title-wrap {
  display: flex;
  flex-direction: column;
}
.brand-title {
  font-size: 14px;
  font-weight: 800;
  color: #FFFFFF;
  letter-spacing: -0.01em;
}
.brand-subtitle {
  font-size: 11px;
  color: var(--text-subtle);
  font-weight: 500;
}
.nav-divider {
  width: 1px;
  height: 28px;
  background: rgba(255, 255, 255, 0.15);
}
.nav-links {
  display: flex;
  gap: 4px;
}
.nav-link-btn {
  background: transparent;
  border: none;
  color: #94A3B8;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-link-btn:hover {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.08);
}
.nav-link-btn.active {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.12);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.search-input-box {
  position: relative;
}
.search-input {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 99px;
  padding: 7px 14px 7px 34px;
  color: #FFFFFF;
  font-size: 12.5px;
  width: 260px;
  transition: all 0.2s;
}
.search-input:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.16);
  border-color: var(--f5-blue-600);
  width: 320px;
}
.search-input::placeholder { color: #64748B; }
.search-icon-svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #64748B;
  pointer-events: none;
}

.env-status-badge {
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #34D399;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  display: flex;
  align-items: center;
  gap: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.pulse-dot {
  width: 6px;
  height: 6px;
  background: #34D399;
  border-radius: 50%;
  box-shadow: 0 0 6px #34D399;
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  background: rgba(255, 255, 255, 0.08);
  padding: 4px 12px 4px 5px;
  border-radius: 99px;
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.user-avatar-circle {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0066FF, #0052CC);
  color: #FFFFFF;
  font-weight: 700;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.user-details {
  display: flex;
  flex-direction: column;
}
.user-name {
  font-size: 12px;
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.1;
}
.user-role {
  font-size: 10px;
  color: #94A3B8;
}
.btn-demo-reset {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #CBD5E1;
  font-size: 11px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-demo-reset:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #FFFFFF;
}

/* ---------------------------------------------------------------- MAIN CONTAINER */
.page-container {
  max-width: 1440px;
  margin: 24px auto 60px;
  padding: 0 32px;
}

/* ---------------------------------------------------------------- KPI HERO SECTION */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr) 1.2fr;
  gap: 16px;
  margin-bottom: 24px;
}
.kpi-stat-card {
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: transform 0.15s, box-shadow 0.15s;
}
.kpi-stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card-hover);
}
.kpi-stat-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: transparent;
}
.kpi-stat-card.card-blue::before { background: var(--f5-blue-600); }
.kpi-stat-card.card-green::before { background: var(--status-success); }
.kpi-stat-card.card-amber::before { background: var(--status-warning); }
.kpi-stat-card.card-red::before { background: var(--status-danger); }
.kpi-stat-card.card-navy::before { background: var(--f5-navy-700); }

.kpi-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.kpi-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.kpi-icon {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.icon-blue { background: #EFF6FF; color: var(--f5-blue-600); }
.icon-green { background: #ECFDF5; color: var(--status-success); }
.icon-amber { background: #FFFBEB; color: var(--status-warning); }
.icon-red { background: #FEF2F2; color: var(--status-danger); }
.icon-navy { background: #F1F5F9; color: var(--f5-navy-700); }

.kpi-stat-value {
  font-size: 26px;
  font-weight: 800;
  color: var(--text-heading);
  line-height: 1.1;
}
.kpi-stat-footer {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi-pill {
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
}

/* ---------------------------------------------------------------- QUEUE SECTION */
.content-card {
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.queue-header-bar {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  background: #FAFCFE;
}
.segmented-filters {
  display: inline-flex;
  background: var(--surface-subtle);
  padding: 3px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
}
.seg-tab-btn {
  background: transparent;
  border: none;
  padding: 6px 14px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.seg-tab-btn:hover {
  color: var(--text-heading);
}
.seg-tab-btn.active {
  background: var(--surface-card);
  color: var(--f5-blue-600);
  box-shadow: var(--shadow-sm);
  font-weight: 700;
}
.badge-count {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 99px;
  background: #E2E8F0;
  color: var(--text-heading);
  font-weight: 700;
}
.seg-tab-btn.active .badge-count {
  background: var(--f5-blue-50);
  color: var(--f5-blue-600);
}

.table-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Modern Datatable */
.modern-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  text-align: left;
}
.modern-table th {
  background: #F8FAFC;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-light);
}
.modern-table td {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
  transition: background-color 0.12s;
}
.modern-table tbody tr:hover td {
  background: #F8FAFD;
}
.modern-table tbody tr:last-child td {
  border-bottom: none;
}

.po-number-cell {
  display: flex;
  align-items: center;
  gap: 12px;
}
.pdf-icon-badge {
  width: 34px;
  height: 34px;
  background: #FEE2E2;
  color: #DC2626;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 10px;
  flex: none;
}
.po-text-info strong {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  display: block;
}
.po-text-info span {
  font-size: 11.5px;
  color: var(--text-muted);
}

.reseller-info-cell strong {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-heading);
}
.channel-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-xs);
  background: var(--surface-subtle);
  color: var(--text-muted);
  border: 1px solid var(--border-light);
  display: inline-block;
  margin-top: 2px;
}
.quote-mono-cell code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  background: #F1F5F9;
  padding: 2px 6px;
  border-radius: var(--radius-xs);
  color: var(--f5-navy-800);
}
.amount-mono-cell {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  text-align: right;
}

/* Status Chips */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.status-pill.status-ready {
  background: var(--status-success-bg);
  color: var(--status-success);
  border: 1px solid var(--status-success-border);
}
.status-pill.status-review {
  background: var(--status-warning-bg);
  color: var(--status-warning);
  border: 1px solid var(--status-warning-border);
}
.status-pill.status-return {
  background: var(--status-danger-bg);
  color: var(--status-danger);
  border: 1px solid var(--status-danger-border);
}
.status-pill.status-booked {
  background: #F1F5F9;
  color: var(--text-muted);
  border: 1px solid #CBD5E1;
}

/* Action Buttons */
.btn-action-primary {
  background: var(--f5-blue-600);
  color: #FFFFFF;
  border: none;
  font-size: 12.5px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 4px rgba(0, 102, 255, 0.2);
}
.btn-action-primary:hover {
  background: var(--f5-blue-700);
  box-shadow: 0 4px 8px rgba(0, 102, 255, 0.3);
}
.btn-action-outline {
  background: #FFFFFF;
  color: var(--text-heading);
  border: 1px solid var(--border-strong);
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-action-outline:hover {
  background: var(--surface-subtle);
  border-color: var(--text-muted);
}

/* ---------------------------------------------------------------- DETAIL WORKSPACE */
.detail-hero-card {
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 24px;
  margin-bottom: 24px;
}
.detail-top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.breadcrumb-trail {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
}
.breadcrumb-btn {
  background: none;
  border: none;
  padding: 0;
  color: var(--f5-blue-600);
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}
.breadcrumb-btn:hover { text-decoration: underline; }

.detail-main-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.po-hero-title-group h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  color: var(--text-heading);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 12px;
}
.po-hero-sub {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--text-muted);
}

/* Pipeline Chevron Stepper */
.workflow-stepper {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 24px;
  background: var(--surface-subtle);
  padding: 6px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
}
.step-item {
  background: transparent;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.step-item.step-done {
  background: #FFFFFF;
  color: var(--status-success);
  box-shadow: var(--shadow-sm);
}
.step-item.step-active {
  background: var(--f5-navy-900);
  color: #FFFFFF;
  box-shadow: 0 2px 6px rgba(10, 22, 40, 0.2);
}

/* Quick Attribute Strip */
.quick-attributes-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border-light);
}
.qa-box {
  display: flex;
  flex-direction: column;
}
.qa-box label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.qa-box .qa-val {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  margin-top: 2px;
}

/* Alert Callouts */
.alert-callout-box {
  padding: 14px 18px;
  border-radius: var(--radius-md);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.alert-callout-box.alert-ready {
  background: #F0FDF4;
  border: 1px solid #BBF7D0;
  color: #166534;
}
.alert-callout-box.alert-review {
  background: #FFFBEB;
  border: 1px solid #FDE68A;
  color: #92400E;
}
.alert-callout-box.alert-return {
  background: #FEF2F2;
  border: 1px solid #FECACA;
  color: #991B1B;
}

/* ---------------------------------------------------------------- WORKSPACE SPLIT (70/30) */
.workspace-grid {
  display: grid;
  grid-template-columns: 1.8fr 1.2fr;
  gap: 24px;
}
@media (max-width: 1200px) {
  .workspace-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .workflow-stepper { grid-template-columns: 1fr; }
}

/* Tab Header for Main Stage */
.stage-tab-nav {
  display: flex;
  gap: 4px;
  border-bottom: 2px solid var(--border-light);
  margin-bottom: 20px;
}
.stage-tab-btn {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 18px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  margin-bottom: -2px;
  transition: all 0.15s;
}
.stage-tab-btn:hover { color: var(--f5-navy-900); }
.stage-tab-btn.active {
  color: var(--f5-blue-600);
  border-bottom-color: var(--f5-blue-600);
  font-weight: 700;
}

/* Side-by-Side Visual Diff Table */
.diff-table {
  width: 100%;
  border-collapse: collapse;
}
.diff-table th {
  background: #F8FAFC;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-light);
}
.diff-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: top;
}
.diff-table tr.has-variance td {
  background: #FFF7ED;
}
.variance-tag {
  color: #C2410C;
  font-size: 11px;
  font-weight: 700;
  display: block;
  margin-top: 2px;
}

/* Checklist Cards */
.check-item-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-light);
  transition: background-color 0.12s;
}
.check-item-row:hover { background: #F8FAFC; }
.check-item-row:last-child { border-bottom: none; }
.check-badge-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  flex: none;
}

  /* ---------------------------------------------------------------- CONTROLLER */
  function updateApp() {
    var root = document.getElementById("appRoot");
    if (appState.view.type === "detail") {
      var o = getOrderById(appState.view.id);
      if (!o) { appState.view = { type: "queue" }; return updateApp(); }
      root.innerHTML = renderDetailView(o);
    } else {
      root.innerHTML = renderQueueView();
    }
    saveState();
  }

  /* ---------------------------------------------------------------- EVENTS */
  document.addEventListener("click", function(e) {
    // Open Order Detail
    var openBtn = e.target.closest("[data-open-order]");
    if (openBtn) {
      var id = openBtn.getAttribute("data-open-order");
      appState.view = { type: "detail", id: id };
      updateApp();
      window.scrollTo(0, 0);
      return;
    }

    // Back to Queue
    var backBtn = e.target.closest("#backToQueueBtn, #navHomeBtn, #navQueueBtn");
    if (backBtn) {
      appState.view = { type: "queue" };
      updateApp();
      window.scrollTo(0, 0);
      return;
    }

    // Segmented Queue Tab
    var segTab = e.target.closest("[data-seg-tab]");
    if (segTab) {
      appState.activeTab = segTab.getAttribute("data-seg-tab");
      updateApp();
      return;
    }

    // Detail Sub-Tab (Reconcile vs Checklist)
    var detailTab = e.target.closest("[data-detail-tab]");
    if (detailTab) {
      var o = getOrderById(appState.view.id);
      if (o) {
        o.detailTab = detailTab.getAttribute("data-detail-tab");
        updateApp();
      }
      return;
    }

    // Acknowledge Flag
    var ack = e.target.closest("[data-ack-flag]");
    if (ack) {
      var fid = ack.getAttribute("data-ack-flag");
      var o = getOrderById(appState.view.id);
      if (o) {
        if (!o.reviewedFlags) o.reviewedFlags = [];
        o.reviewedFlags.push(fid);
        updateApp();
      }
      return;
    }

    // Undo Flag
    var undo = e.target.closest("[data-undo-flag]");
    if (undo) {
      e.preventDefault();
      var fid = undo.getAttribute("data-undo-flag");
      var o = getOrderById(appState.view.id);
      if (o && o.reviewedFlags) {
        o.reviewedFlags = o.reviewedFlags.filter(function(x){ return x !== fid; });
        updateApp();
      }
      return;
    }

    // Toggle JSON Area
    var toggleJson = e.target.closest("#toggleJsonViewerBtn");
    if (toggleJson) {
      var box = document.getElementById("jsonViewerArea");
      if (box) box.style.display = box.style.display === "none" ? "block" : "none";
      return;
    }

    // Trigger Approve Modal
    var approve = e.target.closest('[data-action="approve"]');
    if (approve && !approve.disabled) {
      triggerApproveModal(getOrderById(appState.view.id));
      return;
    }

    // Trigger Return Modal
    var returnAction = e.target.closest('[data-action="return"]');
    if (returnAction) {
      triggerReturnModal(getOrderById(appState.view.id));
      return;
    }

    // Refresh Sync
    var ref = e.target.closest("#refreshStreamBtn");
    if (ref) {
      notifyToast("🔄 Inbound stream refreshed from Azure Blob container.");
      return;
    }
  });

  // Global Search Input
  document.getElementById("globalSearchInput").addEventListener("input", function(e) {
    appState.searchQuery = e.target.value;
    if (appState.view.type !== "queue") appState.view = { type: "queue" };
    updateApp();
  });

  // Reset Demo
  document.getElementById("resetDemoBtn").addEventListener("click", function() {
    localStorage.removeItem(STORAGE_KEY);
    appState = loadState();
    updateApp();
    notifyToast("🔄 Demo reset to initial pristine state.");
  });

    html += '</div></div>';

    html += '<div class="modal-footer-bar">';
    html += '<button type="button" class="btn-action-outline" id="cancelModalBtn">Cancel</button>';
    html += '<button type="button" class="btn-action-primary" id="confirmApproveBtn">Create Booking Form in SFDC</button>';
    html += '</div></div></div>';

    modalHost.innerHTML = html;

    document.getElementById("closeModalBtn").onclick = closeModal;
    document.getElementById("cancelModalBtn").onclick = closeModal;
    document.getElementById("confirmApproveBtn").onclick = function() {
      o.status = "booked";
      closeModal();
      updateApp();
      notifyToast("✅ Successfully created Booking Form BF-AUTO-" + o.po + " in Salesforce!");
    };
  }

  function triggerReturnModal(o) {
    var modalHost = document.getElementById("modalHost");
    var emailBody = "Hello " + o.from + " Order Operations,\n\nThank you for Purchase Order " + o.po + ".\n\nBefore F5 Sales Operations can proceed with booking this order, please provide clarification on the following items:\n\n";
    (o.flags || []).forEach(function(f) {
      emailBody += "  • " + f.title + ": " + f.detail + "\n";
    });
    emailBody += "\nPlease reply with the updated information or submit a revised purchase order.\n\nThank you,\nF5 Sales Operations Desk";

    var html = '<div class="modal-backdrop-blur">';
    html += '<div class="modern-modal-card" style="max-width:700px;">';
    html += '<div class="modal-header-bar" style="background:var(--f5-red-500);">';
    html += '<h3>✉️ Return to Reseller — Discrepancy Notice</h3>';
    html += '<button type="button" class="btn-close-modal" id="closeModalBtn">&times;</button>';
    html += '</div>';

    html += '<div class="modal-body-pad">';
    html += '<div style="margin-bottom:12px;font-size:12.5px;color:var(--text-muted);">';
    html += '<strong>To:</strong> <code>' + escapeHtml(o.from) + ' Order Desk</code> &bull; <strong>Subject:</strong> <code>Inquiry Regarding F5 Purchase Order #' + escapeHtml(o.po) + '</code>';
    html += '</div>';
    html += '<textarea class="modern-input" id="emailDraftArea" style="min-height:240px;font-family:monospace;font-size:12px;">' + escapeHtml(emailBody) + '</textarea>';
    html += '</div>';

    html += '<div class="modal-footer-bar">';
    html += '<button type="button" class="btn-action-outline" id="cancelModalBtn">Cancel</button>';
    html += '<button type="button" class="btn-action-outline" id="copyEmailClipboardBtn">📋 Copy to Clipboard</button>';
    html += '<button type="button" class="btn-action-primary" id="confirmReturnSubmitBtn" style="background:var(--f5-red-500);">Mark as Returned to Reseller</button>';
    html += '</div></div></div>';

    modalHost.innerHTML = html;

    document.getElementById("closeModalBtn").onclick = closeModal;
    document.getElementById("cancelModalBtn").onclick = closeModal;
    document.getElementById("copyEmailClipboardBtn").onclick = function() {
      var text = document.getElementById("emailDraftArea").value;
      navigator.clipboard.writeText(text);
      notifyToast("📋 Copied email notice to clipboard!");
    };
    document.getElementById("confirmReturnSubmitBtn").onclick = function() {
      o.status = "return";
      closeModal();
      updateApp();
      notifyToast("✉️ PO #" + o.po + " marked as Returned to Reseller.");
    };
  }

  function closeModal() {
    document.getElementById("modalHost").innerHTML = "";
  }

  updateApp();
})();
</script>
</body>
</html>
