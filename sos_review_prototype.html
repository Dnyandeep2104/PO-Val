<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F5 Sales Operations — PO Validation & Booking Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* F5 Brand & Enterprise Color Palette */
  --f5-navy-900: #0A1628;
  --f5-navy-800: #0F233E;
  --f5-navy-700: #163259;
  --f5-blue-600: #0066FF;
  --f5-blue-700: #0052CC;
  --f5-blue-50: #EFF6FF;
  --f5-red-500: #E11D48;
  --f5-red-50: #FFF1F2;
  
  /* Slate & Neutral Surfaces */
  --bg-app: #F8FAFC;
  --surface-card: #FFFFFF;
  --surface-subtle: #F1F5F9;
  --border-light: #E2E8F0;
  --border-strong: #CBD5E1;
  
  /* Typography */
  --text-heading: #0F172A;
  --text-body: #334155;
  --text-muted: #64748B;
  --text-subtle: #94A3B8;
  
  /* Functional Status Colors */
  --status-success: #059669;
  --status-success-bg: #ECFDF5;
  --status-success-border: #A7F3D0;
  
  --status-warning: #D97706;
  --status-warning-bg: #FFFBEB;
  --status-warning-border: #FDE68A;
  
  --status-danger: #DC2626;
  --status-danger-bg: #FEF2F2;
  --status-danger-border: #FECACA;
  
  --status-info: #0284C7;
  --status-info-bg: #F0F9FF;
  --status-info-border: #BAE6FD;
  
  /* Shadows & Radius */
  --radius-xs: 4px;
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-card: 0 4px 6px -1px rgba(15, 23, 42, 0.04), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
  --shadow-card-hover: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.03);
  --shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.25);
}

*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg-app);
  color: var(--text-body);
  font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  font-size: 13.5px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ---------------------------------------------------------------- NAVBAR */
.top-navbar {
  background: var(--f5-navy-900);
  color: #FFFFFF;
  padding: 0 28px;
  height: 60px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 2px solid var(--f5-red-500);
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(10, 22, 40, 0.15);
}
.brand-area {
  display: flex;
  align-items: center;
  gap: 16px;
}
.f5-logo-container {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  cursor: pointer;
}
.f5-symbol {
  width: 28px;
  height: 28px;
  background: var(--f5-red-500);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 14px;
  color: #FFFFFF;
  letter-spacing: -0.05em;
  box-shadow: 0 2px 8px rgba(225, 29, 72, 0.4);
}
.brand-title-wrap {
  display: flex;
  flex-direction: column;
}
.brand-title {
  font-size: 14px;
  font-weight: 800;
  color: #FFFFFF;
  letter-spacing: -0.01em;
}
.brand-subtitle {
  font-size: 11px;
  color: var(--text-subtle);
  font-weight: 500;
}
.nav-divider {
  width: 1px;
  height: 28px;
  background: rgba(255, 255, 255, 0.15);
}
.nav-links {
  display: flex;
  gap: 4px;
}
.nav-link-btn {
  background: transparent;
  border: none;
  color: #94A3B8;
  font-size: 13px;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-link-btn:hover {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.08);
}
.nav-link-btn.active {
  color: #FFFFFF;
  background: rgba(255, 255, 255, 0.12);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 14px;
}
.search-input-box {
  position: relative;
}
.search-input {
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.16);
  border-radius: 99px;
  padding: 7px 14px 7px 34px;
  color: #FFFFFF;
  font-size: 12.5px;
  width: 260px;
  transition: all 0.2s;
}
.search-input:focus {
  outline: none;
  background: rgba(255, 255, 255, 0.16);
  border-color: var(--f5-blue-600);
  width: 320px;
}
.search-input::placeholder { color: #64748B; }
.search-icon-svg {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #64748B;
  pointer-events: none;
}

.env-status-badge {
  background: rgba(16, 185, 129, 0.15);
  border: 1px solid rgba(16, 185, 129, 0.3);
  color: #34D399;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 99px;
  display: flex;
  align-items: center;
  gap: 6px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.pulse-dot {
  width: 6px;
  height: 6px;
  background: #34D399;
  border-radius: 50%;
  box-shadow: 0 0 6px #34D399;
}
.user-chip {
  display: flex;
  align-items: center;
  gap: 9px;
  background: rgba(255, 255, 255, 0.08);
  padding: 4px 12px 4px 5px;
  border-radius: 99px;
  border: 1px solid rgba(255, 255, 255, 0.12);
}
.user-avatar-circle {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  background: linear-gradient(135deg, #0066FF, #0052CC);
  color: #FFFFFF;
  font-weight: 700;
  font-size: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.user-details {
  display: flex;
  flex-direction: column;
}
.user-name {
  font-size: 12px;
  font-weight: 700;
  color: #FFFFFF;
  line-height: 1.1;
}
.user-role {
  font-size: 10px;
  color: #94A3B8;
}
.btn-demo-reset {
  background: transparent;
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #CBD5E1;
  font-size: 11px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
}
.btn-demo-reset:hover {
  background: rgba(255, 255, 255, 0.12);
  color: #FFFFFF;
}

/* ---------------------------------------------------------------- MAIN CONTAINER */
.page-container {
  max-width: 1440px;
  margin: 24px auto 60px;
  padding: 0 32px;
}

/* ---------------------------------------------------------------- KPI HERO SECTION */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr) 1.2fr;
  gap: 16px;
  margin-bottom: 24px;
}
.kpi-stat-card {
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-md);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
  position: relative;
  overflow: hidden;
  transition: transform 0.15s, box-shadow 0.15s;
}
.kpi-stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-card-hover);
}
.kpi-stat-card::before {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: transparent;
}
.kpi-stat-card.card-blue::before { background: var(--f5-blue-600); }
.kpi-stat-card.card-green::before { background: var(--status-success); }
.kpi-stat-card.card-amber::before { background: var(--status-warning); }
.kpi-stat-card.card-red::before { background: var(--status-danger); }
.kpi-stat-card.card-navy::before { background: var(--f5-navy-700); }

.kpi-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}
.kpi-title {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.kpi-icon {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
}
.icon-blue { background: #EFF6FF; color: var(--f5-blue-600); }
.icon-green { background: #ECFDF5; color: var(--status-success); }
.icon-amber { background: #FFFBEB; color: var(--status-warning); }
.icon-red { background: #FEF2F2; color: var(--status-danger); }
.icon-navy { background: #F1F5F9; color: var(--f5-navy-700); }

.kpi-stat-value {
  font-size: 26px;
  font-weight: 800;
  color: var(--text-heading);
  line-height: 1.1;
}
.kpi-stat-footer {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.kpi-pill {
  font-size: 10.5px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 99px;
}

/* ---------------------------------------------------------------- QUEUE SECTION */
.content-card {
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  overflow: hidden;
}
.queue-header-bar {
  padding: 16px 24px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  background: #FAFCFE;
}
.segmented-filters {
  display: inline-flex;
  background: var(--surface-subtle);
  padding: 3px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
}
.seg-tab-btn {
  background: transparent;
  border: none;
  padding: 6px 14px;
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-muted);
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.seg-tab-btn:hover {
  color: var(--text-heading);
}
.seg-tab-btn.active {
  background: var(--surface-card);
  color: var(--f5-blue-600);
  box-shadow: var(--shadow-sm);
  font-weight: 700;
}
.badge-count {
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 99px;
  background: #E2E8F0;
  color: var(--text-heading);
  font-weight: 700;
}
.seg-tab-btn.active .badge-count {
  background: var(--f5-blue-50);
  color: var(--f5-blue-600);
}

.table-toolbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Modern Datatable */
.modern-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  text-align: left;
}
.modern-table th {
  background: #F8FAFC;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  padding: 12px 20px;
  border-bottom: 1px solid var(--border-light);
}
.modern-table td {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: middle;
  transition: background-color 0.12s;
}
.modern-table tbody tr:hover td {
  background: #F8FAFD;
}
.modern-table tbody tr:last-child td {
  border-bottom: none;
}

.po-number-cell {
  display: flex;
  align-items: center;
  gap: 12px;
}
.pdf-icon-badge {
  width: 34px;
  height: 34px;
  background: #FEE2E2;
  color: #DC2626;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 800;
  font-size: 10px;
  flex: none;
}
.po-text-info strong {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  display: block;
}
.po-text-info span {
  font-size: 11.5px;
  color: var(--text-muted);
}

.reseller-info-cell strong {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-heading);
}
.channel-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 8px;
  border-radius: var(--radius-xs);
  background: var(--surface-subtle);
  color: var(--text-muted);
  border: 1px solid var(--border-light);
  display: inline-block;
  margin-top: 2px;
}
.quote-mono-cell code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 600;
  background: #F1F5F9;
  padding: 2px 6px;
  border-radius: var(--radius-xs);
  color: var(--f5-navy-800);
}
.amount-mono-cell {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  text-align: right;
}

/* Status Chips */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 99px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
.status-pill.status-ready {
  background: var(--status-success-bg);
  color: var(--status-success);
  border: 1px solid var(--status-success-border);
}
.status-pill.status-review {
  background: var(--status-warning-bg);
  color: var(--status-warning);
  border: 1px solid var(--status-warning-border);
}
.status-pill.status-return {
  background: var(--status-danger-bg);
  color: var(--status-danger);
  border: 1px solid var(--status-danger-border);
}
.status-pill.status-booked {
  background: #F1F5F9;
  color: var(--text-muted);
  border: 1px solid #CBD5E1;
}

/* Action Buttons */
.btn-action-primary {
  background: var(--f5-blue-600);
  color: #FFFFFF;
  border: none;
  font-size: 12.5px;
  font-weight: 700;
  padding: 7px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 4px rgba(0, 102, 255, 0.2);
}
.btn-action-primary:hover {
  background: var(--f5-blue-700);
  box-shadow: 0 4px 8px rgba(0, 102, 255, 0.3);
}
.btn-action-outline {
  background: #FFFFFF;
  color: var(--text-heading);
  border: 1px solid var(--border-strong);
  font-size: 12.5px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: var(--radius-md);
  cursor: pointer;
  transition: all 0.15s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-action-outline:hover {
  background: var(--surface-subtle);
  border-color: var(--text-muted);
}

/* ---------------------------------------------------------------- DETAIL WORKSPACE */
.detail-hero-card {
  background: var(--surface-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card);
  padding: 24px;
  margin-bottom: 24px;
}
.detail-top-nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.breadcrumb-trail {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
}
.breadcrumb-btn {
  background: none;
  border: none;
  padding: 0;
  color: var(--f5-blue-600);
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 4px;
}
.breadcrumb-btn:hover { text-decoration: underline; }

.detail-main-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 16px;
  margin-bottom: 20px;
}
.po-hero-title-group h1 {
  margin: 0;
  font-size: 24px;
  font-weight: 800;
  color: var(--text-heading);
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 12px;
}
.po-hero-sub {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--text-muted);
}

/* Pipeline Chevron Stepper */
.workflow-stepper {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  margin-bottom: 24px;
  background: var(--surface-subtle);
  padding: 6px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border-light);
}
.step-item {
  background: transparent;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  text-align: center;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}
.step-item.step-done {
  background: #FFFFFF;
  color: var(--status-success);
  box-shadow: var(--shadow-sm);
}
.step-item.step-active {
  background: var(--f5-navy-900);
  color: #FFFFFF;
  box-shadow: 0 2px 6px rgba(10, 22, 40, 0.2);
}

/* Quick Attribute Strip */
.quick-attributes-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border-light);
}
.qa-box {
  display: flex;
  flex-direction: column;
}
.qa-box label {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.qa-box .qa-val {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-heading);
  margin-top: 2px;
}

/* Alert Callouts */
.alert-callout-box {
  padding: 14px 18px;
  border-radius: var(--radius-md);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
}
.alert-callout-box.alert-ready {
  background: #F0FDF4;
  border: 1px solid #BBF7D0;
  color: #166534;
}
.alert-callout-box.alert-review {
  background: #FFFBEB;
  border: 1px solid #FDE68A;
  color: #92400E;
}
.alert-callout-box.alert-return {
  background: #FEF2F2;
  border: 1px solid #FECACA;
  color: #991B1B;
}

/* ---------------------------------------------------------------- WORKSPACE SPLIT (70/30) */
.workspace-grid {
  display: grid;
  grid-template-columns: 1.8fr 1.2fr;
  gap: 24px;
}
@media (max-width: 1200px) {
  .workspace-grid { grid-template-columns: 1fr; }
  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .workflow-stepper { grid-template-columns: 1fr; }
}

/* Tab Header for Main Stage */
.stage-tab-nav {
  display: flex;
  gap: 4px;
  border-bottom: 2px solid var(--border-light);
  margin-bottom: 20px;
}
.stage-tab-btn {
  background: transparent;
  border: none;
  border-bottom: 2px solid transparent;
  padding: 10px 18px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-muted);
  cursor: pointer;
  margin-bottom: -2px;
  transition: all 0.15s;
}
.stage-tab-btn:hover { color: var(--f5-navy-900); }
.stage-tab-btn.active {
  color: var(--f5-blue-600);
  border-bottom-color: var(--f5-blue-600);
  font-weight: 700;
}

/* Side-by-Side Visual Diff Table */
.diff-table {
  width: 100%;
  border-collapse: collapse;
}
.diff-table th {
  background: #F8FAFC;
  color: var(--text-muted);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-light);
}
.diff-table td {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-light);
  vertical-align: top;
}
.diff-table tr.has-variance td {
  background: #FFF7ED;
}
.variance-tag {
  color: #C2410C;
  font-size: 11px;
  font-weight: 700;
  display: block;
  margin-top: 2px;
}

/* Checklist Cards */
.check-item-row {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border-light);
  transition: background-color 0.12s;
}
.check-item-row:hover { background: #F8FAFC; }
.check-item-row:last-child { border-bottom: none; }
.check-badge-icon {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
  flex: none;
}

/* Toast */

  bottom: 28px;

}

}
</style>

<div class="floating-toast-alert" id="toastAlert"></div>

<script>
(function() {
  "use strict";

  /* Live Inbound Orders Store (Starts clean for live testing) */
  var SAMPLE_ORDERS = [];

  /* State Storage */
  var STORAGE_KEY = "f5_sos_live_v5_state";
  var usdFormatter = new Intl.NumberFormat("en-US", { style: "currency", currency: "USD" });
  function fmtMoney(v) { return typeof v === "number" ? usdFormatter.format(v) : (v || ""); }
  function escapeHtml(str) { return String(str || "").replace(/[&<>"']/g, function(m) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]; }); }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) return JSON.parse(raw);
    } catch(e) {}
    return {
      activeTab: "all",
      searchQuery: "",
      view: { type: "queue" },
      orders: []
    };
  }

  var appState = loadState();
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(appState)); } catch(e) {}
  }

  function getOrderById(id) {
    for (var i = 0; i < appState.orders.length; i++) {
      if (appState.orders[i].id === id) return appState.orders[i];
    }
    return null;
  }

  function notifyToast(text) {
    var toast = document.getElementById("toastAlert");
    toast.innerText = text;
    toast.classList.add("visible");
    setTimeout(function() { toast.classList.remove("visible"); }, 2800);
  }

  /* ---------------------------------------------------------------- RENDER QUEUE */
  function renderQueueView() {
    var orders = appState.orders;
    var q = (appState.searchQuery || "").toLowerCase();

    // Filter by Search Query
    if (q) {
      orders = orders.filter(function(o) {
        return o.po.toLowerCase().indexOf(q) > -1 ||
               o.from.toLowerCase().indexOf(q) > -1 ||
               o.quote.toLowerCase().indexOf(q) > -1 ||
               (o.opportunity && o.opportunity.toLowerCase().indexOf(q) > -1);
      });
    }

    // Filter by Active Tab
    var filtered = orders;
    if (appState.activeTab === "ready") filtered = orders.filter(function(o){ return o.status === "ready"; });
    else if (appState.activeTab === "review") filtered = orders.filter(function(o){ return o.status === "review"; });
    else if (appState.activeTab === "return") filtered = orders.filter(function(o){ return o.status === "return"; });
    else if (appState.activeTab === "booked") filtered = orders.filter(function(o){ return o.status === "booked"; });

    var totalReady = appState.orders.filter(function(o){ return o.status === "ready"; }).length;
    var totalReview = appState.orders.filter(function(o){ return o.status === "review"; }).length;
    var totalReturn = appState.orders.filter(function(o){ return o.status === "return"; }).length;
    var totalBooked = appState.orders.filter(function(o){ return o.status === "booked"; }).length;

    var html = '<div>';

    // 1. Executive KPI Cards
    html += '<section class="kpi-grid">';
    html += '<div class="kpi-stat-card card-blue">';
    html += '<div class="kpi-header"><span class="kpi-title">Inbound Stream</span><div class="kpi-icon icon-blue">📥</div></div>';
    html += '<div class="kpi-stat-value">' + appState.orders.length + ' Orders</div>';
    html += '<div class="kpi-stat-footer"><span class="kpi-pill icon-blue">Auto-Ingest</span> Live PowerAutomate Blob</div>';
    html += '</div>';

    html += '<div class="kpi-stat-card card-green">';
    html += '<div class="kpi-header"><span class="kpi-title">Clean Auto-Matches</span><div class="kpi-icon icon-green">⚡</div></div>';
    html += '<div class="kpi-stat-value" style="color:var(--status-success);">' + totalReady + ' Ready</div>';
    html += '<div class="kpi-stat-footer"><span class="kpi-pill icon-green">100% Match</span> Direct 1-Click Booking</div>';
    html += '</div>';

    html += '<div class="kpi-stat-card card-amber">';
    html += '<div class="kpi-header"><span class="kpi-title">Pending Review</span><div class="kpi-icon icon-amber">⚠️</div></div>';
    html += '<div class="kpi-stat-value" style="color:var(--status-warning);">' + totalReview + ' Flagged</div>';
    html += '<div class="kpi-stat-footer"><span class="kpi-pill icon-amber">SOS Triage</span> Price/IncoTerms Exception</div>';
    html += '</div>';

    html += '<div class="kpi-stat-card card-red">';
    html += '<div class="kpi-header"><span class="kpi-title">Quote Missing</span><div class="kpi-icon icon-red">🛑</div></div>';
    html += '<div class="kpi-stat-value" style="color:var(--status-danger);">' + totalReturn + ' Blocked</div>';
    html += '<div class="kpi-stat-footer"><span class="kpi-pill icon-red">Reseller Action</span> Auto-draft Discrepancy</div>';
    html += '</div>';

    html += '<div class="kpi-stat-card card-navy">';
    html += '<div class="kpi-header"><span class="kpi-title">Processing Velocity</span><div class="kpi-icon icon-navy">⚡</div></div>';
    html += '<div class="kpi-stat-value" style="color:var(--f5-blue-600);">< 1.8s</div>';
    html += '<div class="kpi-stat-footer">Snowflake RAW replica latency</div>';
    html += '</div>';
    html += '</section>';

    // 2. Datatable Container
    html += '<div class="content-card">';
    html += '<div class="queue-header-bar">';
    html += '<div class="segmented-filters">';
    html += '<button type="button" class="seg-tab-btn ' + (appState.activeTab === "all" ? "active" : "") + '" data-seg-tab="all">All Inbound <span class="badge-count">' + appState.orders.length + '</span></button>';
    html += '<button type="button" class="seg-tab-btn ' + (appState.activeTab === "ready" ? "active" : "") + '" data-seg-tab="ready">⚡ Ready to Book <span class="badge-count">' + totalReady + '</span></button>';
    html += '<button type="button" class="seg-tab-btn ' + (appState.activeTab === "review" ? "active" : "") + '" data-seg-tab="review">⚠️ Needs Review <span class="badge-count">' + totalReview + '</span></button>';
    html += '<button type="button" class="seg-tab-btn ' + (appState.activeTab === "return" ? "active" : "") + '" data-seg-tab="return">🛑 Reseller Action <span class="badge-count">' + totalReturn + '</span></button>';
    html += '<button type="button" class="seg-tab-btn ' + (appState.activeTab === "booked" ? "active" : "") + '" data-seg-tab="booked">✅ Booked Today <span class="badge-count">' + totalBooked + '</span></button>';
    html += '</div>';

    html += '<div class="table-toolbar-actions">';
    html += '<button type="button" class="btn-action-outline" id="refreshStreamBtn">🔄 Refresh Sync</button>';
    html += '</div>';
    html += '</div>';

    // 3. Table
    html += '<table class="modern-table">';
    html += '<thead><tr>';
    html += '<th>Purchase Order #</th>';
    html += '<th>Partner / Channel</th>';
    html += '<th>CPQ Quote / Opp</th>';
    html += '<th style="text-align:right;">Extracted Amount</th>';
    html += '<th>Automated Policy Assessment</th>';
    html += '<th>Timestamp</th>';
    html += '<th style="text-align:right;">Action</th>';
    html += '</tr></thead><tbody>';

    if (!filtered.length) {
      html += '<tr><td colspan="7" style="text-align:center; padding: 48px; color: var(--text-muted); font-style:italic;">No purchase orders in queue. Waiting for live inbound emails...</td></tr>';
    } else {
      filtered.forEach(function(o) {
        var statusBadge = '<span class="status-pill status-ready">✓ READY TO BOOK</span>';
        if (o.status === "review") statusBadge = '<span class="status-pill status-review">⚠️ NEEDS REVIEW (' + o.flags.length + ')</span>';
        else if (o.status === "return") statusBadge = '<span class="status-pill status-return">🛑 QUOTE NOT FOUND</span>';
        else if (o.status === "booked") statusBadge = '<span class="status-pill status-booked">✅ BOOKED IN SFDC</span>';

        var orderTotal = o.booking ? o.booking.amount : o.compare.find(function(c){ return c[0].indexOf("Total") > -1; })[1];

        html += '<tr>';
        html += '<td><div class="po-number-cell">';
        html += '<div class="pdf-icon-badge">PDF</div>';
        html += '<div class="po-text-info"><strong>' + escapeHtml(o.po) + '</strong><span>' + escapeHtml(o.file) + '</span></div>';
        html += '</div></td>';

        html += '<td><div class="reseller-info-cell">';
        html += '<strong>' + escapeHtml(o.from) + '</strong><br>';
        html += '<span class="channel-pill">' + escapeHtml(o.channel) + '</span>';
        html += '</div></td>';

        html += '<td><div class="quote-mono-cell">';
        html += '<code>' + escapeHtml(o.quote) + '</code><br>';
        html += '<span style="font-size:11px;color:var(--text-muted);font-family:monospace;">' + escapeHtml(o.opportunity || "Not Assigned") + '</span>';
        html += '</div></td>';

        html += '<td class="amount-mono-cell">' + fmtMoney(orderTotal) + '</td>';
        html += '<td>' + statusBadge + '<br><span style="font-size:11.5px;color:var(--text-muted);display:inline-block;margin-top:3px;">' + escapeHtml(o.summary) + '</span></td>';
        html += '<td style="color:var(--text-muted);font-size:12px;">' + escapeHtml(o.received) + '</td>';
        html += '<td style="text-align:right;"><button type="button" class="btn-action-primary" data-open-order="' + o.id + '">Inspect & Book ➔</button></td>';
        html += '</tr>';
      });
    }

    html += '</tbody></table></div></div>';
    return html;
  }

  /* ---------------------------------------------------------------- RENDER DETAIL WORKSPACE */
  function renderDetailView(o) {
    (o.flags || []).forEach(function(f, idx) {
      if (!f.id) f.id = "flag_" + (f.rule || "item") + "_" + idx;
    });
    if (!o.reviewedFlags) o.reviewedFlags = [];
    var openFlags = o.flags.filter(function(f){ return o.reviewedFlags.indexOf(f.id) === -1; });
    var isApprovable = o.status === "ready" || (o.status === "review" && openFlags.length === 0);
    var isBooked = o.status === "booked";
    var activeTab = o.detailTab || "reconcile";

    var html = '<div>';

    // 1. Top Hero Card
    html += '<div class="detail-hero-card">';
    html += '<div class="detail-top-nav">';
    html += '<div class="breadcrumb-trail">';
    html += '<button type="button" class="breadcrumb-btn" id="backToQueueBtn">← Back to Inbound Queue</button>';
    html += '<span>/</span>';
    html += '<span>Purchase Order ' + escapeHtml(o.po) + '</span>';
    html += '</div>';

    // Quick Action Buttons
    html += '<div style="display:flex;gap:10px;">';
    if (!isBooked) {
      if (o.status === "return") {
        html += '<button type="button" class="btn-action-outline" data-action="return" style="color:var(--status-danger);border-color:var(--status-danger-border);">✉️ Draft Reseller Return Email</button>';
      } else {
        html += '<button type="button" class="btn-action-outline" data-action="return">✉️ Return to Reseller</button>';
        html += '<button type="button" class="btn-action-primary" data-action="approve" ' + (!isApprovable ? 'disabled style="opacity:0.5;cursor:not-allowed;" title="Review all flagged exceptions first"' : '') + '>⚡ 1-Click Salesforce Booking</button>';
      }
    } else {
      html += '<span class="status-pill status-ready" style="font-size:13px;padding:6px 14px;">✅ Booking Form Active in Salesforce</span>';
    }
    html += '</div>';
    html += '</div>';

    // Hero Title
    html += '<div class="detail-main-header">';
    html += '<div class="po-hero-title-group">';
    html += '<h1>Purchase Order #' + escapeHtml(o.po) + ' <span class="status-pill ' + (o.status === "ready" ? "status-ready" : (o.status === "review" ? "status-review" : (o.status === "return" ? "status-return" : "status-booked"))) + '">' + (o.status === "ready" ? "✓ 100% MATCH" : (o.status === "review" ? "⚠️ EXCEPTION FLAGGED" : (o.status === "return" ? "🛑 INVALID QUOTE" : "✅ BOOKED"))) + '</span></h1>';
    html += '<p class="po-hero-sub">' + escapeHtml(o.from) + ' (' + escapeHtml(o.channel) + ') &bull; PO Date: ' + escapeHtml(o.poDate) + ' &bull; Ingest Source: <code>' + escapeHtml(o.file) + '</code></p>';
    html += '</div>';
    html += '</div>';

    // Workflow Chevron Stepper
    html += '<div class="workflow-stepper">';
    html += '<div class="step-item step-done">1. Inbound Ingest ✓</div>';
    html += '<div class="step-item step-done">2. Generic PDF Parse ✓</div>';
    html += '<div class="step-item step-done">3. Snowflake Cross-Check ✓</div>';
    html += '<div class="step-item ' + (isBooked ? "step-done" : "step-active") + '">4. SOS Policy Review ' + (isBooked ? "✓" : "") + '</div>';
    html += '<div class="step-item ' + (isBooked ? "step-active" : "") + '">5. SFDC Booking Form ' + (isBooked ? "✓" : "") + '</div>';
    html += '</div>';

    // Attribute Ribbon
    var totalVal = o.booking ? o.booking.amount : o.compare.find(function(c){ return c[0].indexOf("Total") > -1; })[1];
    html += '<div class="quick-attributes-grid">';
    html += '<div class="qa-box"><label>CPQ Quote</label><div class="qa-val"><code>' + escapeHtml(o.quote) + '</code></div></div>';
    html += '<div class="qa-box"><label>Salesforce Opp ID</label><div class="qa-val"><code>' + escapeHtml(o.opportunity || "Not Assigned") + '</code></div></div>';
    html += '<div class="qa-box"><label>Net Reconciled Amount</label><div class="qa-val" style="color:var(--f5-blue-600);font-family:monospace;">' + fmtMoney(totalVal) + '</div></div>';
    html += '<div class="qa-box"><label>Order Type</label><div class="qa-val">' + escapeHtml(o.booking ? o.booking.orderType : "Standard") + '</div></div>';
    html += '<div class="qa-box"><label>SFDC Target Stage</label><div class="qa-val" style="color:var(--status-success);">In Process by SOS</div></div>';
    html += '</div>';
    html += '</div>'; // End Hero Card

    // Alert Callout
    if (o.status === "review") {
      html += '<div class="alert-callout-box alert-review">';
      html += '<div><strong>⚠️ Action Required by SOS:</strong> ' + openFlags.length + ' item(s) flagged for human verification. Acknowledge each item below or return the order to the reseller.</div>';
      html += '</div>';
    } else if (o.status === "ready") {
      html += '<div class="alert-callout-box alert-ready">';
      html += '<div><strong>✓ Ready for Immediate Booking:</strong> 100% reconciliation against CPQ quote ' + escapeHtml(o.quote) + '. Click "1-Click Salesforce Booking" above.</div>';
      html += '</div>';
    } else if (o.status === "return") {
      html += '<div class="alert-callout-box alert-return">';
      html += '<div><strong>🛑 Non-Bookable Order:</strong> Referenced quote ' + escapeHtml(o.quote) + ' does not exist in F5 CPQ database. Discrepancy email drafted below.</div>';
      html += '</div>';
    }

    // Flagged Exceptions Card
    if (o.flags.length && !isBooked) {
      html += '<div class="content-card" style="margin-bottom:24px;border-left:4px solid var(--status-warning);">';
      html += '<div style="padding:14px 20px;background:#FFFDF7;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;">';
      html += '<strong style="color:var(--status-warning);font-size:13.5px;">🛡️ Policy Exceptions Requiring SOS Acknowledgement (' + o.flags.length + ')</strong>';
      html += '<div style="display:flex;align-items:center;gap:12px;">';
      html += '<span style="font-size:12px;color:var(--text-muted);">' + (o.flags.length - openFlags.length) + ' of ' + o.flags.length + ' resolved</span>';
      if (openFlags.length > 0) {
        html += '<button type="button" class="btn-action-outline" id="ackAllFlagsBtn" style="font-size:11.5px;padding:4px 10px;background:#FFF;font-weight:600;">✓ Acknowledge All (' + openFlags.length + ')</button>';
      }
      html += '</div>';
      html += '</div>';
      html += '<div style="padding:16px 20px;">';
      o.flags.forEach(function(f, idx) {
        var flagId = f.id || ("flag_" + (f.rule || "item") + "_" + idx);
        var isDone = (o.reviewedFlags || []).indexOf(flagId) > -1;
        html += '<div style="background:#FFFFFF;border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;">';
        html += '<div style="flex:1;">';

  /* ---------------------------------------------------------------- CONTROLLER */
  function updateApp() {
    var root = document.getElementById("appRoot");
    if (appState.view.type === "detail") {
      var o = getOrderById(appState.view.id);
      if (!o) { appState.view = { type: "queue" }; return updateApp(); }
      root.innerHTML = renderDetailView(o);
    } else {
      root.innerHTML = renderQueueView();
    }
    saveState();
  }

  /* ---------------------------------------------------------------- EVENTS */
  document.addEventListener("click", function(e) {
    // Open Order Detail
    var openBtn = e.target.closest("[data-open-order]");
    if (openBtn) {
      var id = openBtn.getAttribute("data-open-order");
      appState.view = { type: "detail", id: id };
      updateApp();
      window.scrollTo(0, 0);
      return;
    }

    // Back to Queue
    var backBtn = e.target.closest("#backToQueueBtn, #navHomeBtn, #navQueueBtn");
    if (backBtn) {
      appState.view = { type: "queue" };
      updateApp();
      window.scrollTo(0, 0);
      return;
    }

    // Segmented Queue Tab
    var segTab = e.target.closest("[data-seg-tab]");
    if (segTab) {
      appState.activeTab = segTab.getAttribute("data-seg-tab");
      updateApp();
      return;
    }

    // Detail Sub-Tab (Reconcile vs Checklist)
    var detailTab = e.target.closest("[data-detail-tab]");
    if (detailTab) {
      var o = getOrderById(appState.view.id);
      if (o) {
        o.detailTab = detailTab.getAttribute("data-detail-tab");
        updateApp();
      }
      return;
    }

    // Acknowledge All Flags
    var ackAll = e.target.closest("#ackAllFlagsBtn");
    if (ackAll) {
      var o = getOrderById(appState.view.id);
      if (o && o.flags) {
        if (!o.reviewedFlags) o.reviewedFlags = [];
        o.flags.forEach(function(f, idx) {
          var fid = f.id || ("flag_" + (f.rule || "item") + "_" + idx);
          if (o.reviewedFlags.indexOf(fid) === -1) {
            o.reviewedFlags.push(fid);
          }
        });
        saveState();
        updateApp();
        notifyToast("✓ All policy exceptions acknowledged for SOS booking.");
      }
      return;
    }

    // Acknowledge Single Flag
    var ack = e.target.closest("[data-ack-flag]");
    if (ack) {
      var fid = ack.getAttribute("data-ack-flag");
      var o = getOrderById(appState.view.id);
      if (o) {
        if (!o.reviewedFlags) o.reviewedFlags = [];
        if (o.reviewedFlags.indexOf(fid) === -1) {
          o.reviewedFlags.push(fid);
        }
        saveState();
        updateApp();
      }
      return;
    }

    // Undo Flag
    var undo = e.target.closest("[data-undo-flag]");
    if (undo) {
      e.preventDefault();
      var fid = undo.getAttribute("data-undo-flag");
      var o = getOrderById(appState.view.id);
      if (o && o.reviewedFlags) {
        o.reviewedFlags = o.reviewedFlags.filter(function(x){ return x !== fid; });
        saveState();
        updateApp();
      }
      return;
    }

    // Trigger Approve Modal
    var approve = e.target.closest('[data-action="approve"]');
    if (approve && !approve.disabled) {
      triggerApproveModal(getOrderById(appState.view.id));
      return;
    }

    // Trigger Return Modal
    var returnAction = e.target.closest('[data-action="return"]');
    if (returnAction) {
      triggerReturnModal(getOrderById(appState.view.id));
      return;
    }

    // Refresh Sync
    var ref = e.target.closest("#refreshStreamBtn");
    if (ref) {
      notifyToast("🔄 Inbound stream refreshed from Azure Blob container.");
      return;
    }
  });

  // Global Search Input
  document.getElementById("globalSearchInput").addEventListener("input", function(e) {
    appState.searchQuery = e.target.value;
    if (appState.view.type !== "queue") appState.view = { type: "queue" };
    updateApp();
  });

          o.status = "booked";
          o.sfdcRecordId = resp.booking_form_id;
          o.sfdcRecordUrl = resp.url;
          o.pdfAttached = resp.pdf_attached;
          o.attachment = resp.attachment;
          saveState();
          updateApp();
          showBookingSuccessModal(o, resp);
        } else {
          var errDetail = (resp && (resp.error || resp.details)) || "Salesforce returned an error.";
          alert("Salesforce Booking Refused:\n\n" + (typeof errDetail === 'object' ? JSON.stringify(errDetail, null, 2) : errDetail));
          btn.disabled = false;
          btn.innerText = "Approve & Book to Salesforce";
        }
      })
      .catch(function(err) {
        alert("Salesforce Booking Network Error:\n\nCould not reach the local validation service (" + (err && err.message || err) + ").\nPlease verify the server is running.");
        btn.disabled = false;
        btn.innerText = "Approve & Book to Salesforce";
      });
    };
  }

  function showBookingSuccessModal(o, resp) {
    var modalHost = document.getElementById("modalHost");
    var html = '<div class="modal-backdrop-blur">';
    html += '<div class="modern-modal-card" style="max-width:640px;">';
    html += '<div class="modal-header-bar" style="background:linear-gradient(135deg, #065F46 0%, #047857 100%);">';
    html += '<h3>✅ Salesforce Booking Form Created</h3>';
    html += '<button type="button" class="btn-close-modal" id="closeModalBtn">&times;</button>';
    html += '</div>';

    html += '<div class="modal-body-pad">';
    html += '<div style="text-align:center;padding:12px 0 20px;">';
    html += '<div style="width:56px;height:56px;border-radius:50%;background:#DCFCE7;color:#166534;font-size:32px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px;">✓</div>';
    html += '<h2 style="margin:0 0 6px;color:#0F172A;font-size:20px;font-weight:800;">Booking Form Generated in Salesforce</h2>';
    html += '<p style="margin:0;color:var(--text-muted);font-size:13px;">Target Instance: <strong>f5--poclab.sandbox.my.salesforce.com</strong> &bull; ' + (resp.dry_run ? '<span style="color:#D97706;font-weight:700;">Demo Simulation Mode</span>' : '<span style="color:#16A34A;font-weight:700;">Live Sandbox Commit</span>') + '</p>';
    html += '</div>';

    html += '<div style="background:#F8FAFC;border:1px solid var(--border-light);border-radius:var(--radius-md);padding:16px;margin-bottom:20px;font-size:13px;">';
    html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #E2E8F0;">';
    html += '<span style="color:var(--text-muted);">Salesforce Record ID:</span>';
    html += '<strong style="font-family:monospace;color:var(--f5-navy-900);">' + escapeHtml(resp.booking_form_id) + '</strong>';
    html += '</div>';
    html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #E2E8F0;">';
    html += '<span style="color:var(--text-muted);">Linked Opportunity:</span>';
    html += '<strong style="font-family:monospace;">' + escapeHtml(o.opportunity) + '</strong>';
    html += '</div>';
    html += '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #E2E8F0;">';
    html += '<span style="color:var(--text-muted);">Booked Total:</span>';
    html += '<strong style="color:#0F172A;">' + fmtMoney(o.booking.amount) + '</strong>';
    html += '</div>';
    html += '<div style="display:flex;justify-content:space-between;padding:6px 0;">';
    html += '<span style="color:var(--text-muted);">Physical PO PDF Attached:</span>';
    html += '<strong style="color:#16A34A;">' + (resp.pdf_attached ? '✓ ContentVersion Attached (' + escapeHtml(o.file) + ')' : 'Attached') + '</strong>';
    html += '</div>';
    html += '</div>';

    html += '<div style="display:flex;gap:12px;justify-content:center;">';
    html += '<a href="' + escapeHtml(resp.url) + '" target="_blank" class="btn-action-primary" style="padding:10px 20px;font-size:13.5px;text-decoration:none;">⚡ Open Booking Form in Salesforce Lightning</a>';
    html += '</div>';
    html += '</div>';

    html += '<div class="modal-footer-bar" style="justify-content:center;">';
    html += '<button type="button" class="btn-action-outline" id="doneModalBtn">Return to SOS Queue</button>';
    html += '</div></div></div>';

    modalHost.innerHTML = html;
    document.getElementById("closeModalBtn").onclick = closeModal;
    document.getElementById("doneModalBtn").onclick = closeModal;
  }

  function triggerInboundUploadModal() {
    var modalHost = document.getElementById("modalHost");
    var html = '<div class="modal-backdrop-blur">';
    html += '<div class="modern-modal-card" style="max-width:680px;">';
    html += '<div class="modal-header-bar">';
    html += '<h3>⚡ Live Inbound PO Ingestion (Azure Blob &amp; Direct Drop)</h3>';
    html += '<button type="button" class="btn-close-modal" id="closeModalBtn">&times;</button>';
    html += '</div>';

    html += '<div class="modal-body-pad">';
    html += '<p style="margin-top:0;font-size:13px;color:var(--text-muted);">Real-time Purchase Order ingestion via automated Azure Blob polling or direct PDF upload for instant SOS extraction and CPQ validation.</p>';

    html += '<div style="background:#F0FDF4;border:1px solid #BBF7D0;border-radius:var(--radius-md);padding:12px 16px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;">';
    html += '<div><span class="pulse-dot" style="background:#16A34A;"></span> <strong>Azure Blob Storage Watcher:</strong> Active (polling <code>purchaseorders</code>)</div>';
    html += '<span style="font-size:11.5px;color:#166534;font-weight:700;">Live Poller 4s</span>';
    html += '</div>';

    html += '<div id="dropZoneBox" style="border:2px dashed #94A3B8;border-radius:var(--radius-lg);padding:32px 20px;text-align:center;cursor:pointer;background:#F8FAFC;transition:all 0.2s;">';
    html += '<div style="font-size:36px;margin-bottom:8px;">📄</div>';
    html += '<div style="font-weight:700;color:var(--f5-navy-900);font-size:15px;margin-bottom:4px;">Drag and drop any PO PDF here, or click to browse</div>';
    html += '<div style="font-size:12.5px;color:var(--text-muted);">Supports raw vendor PDFs (NTT, Dell, Ingram, Synnex, WWT)</div>';
    html += '<input type="file" id="pdfFileInput" accept="application/pdf" style="display:none;">';
    html += '</div>';



    html += '</div>';
    html += '<div class="modal-footer-bar">';
    html += '<button type="button" class="btn-action-outline" id="cancelModalBtn">Close</button>';
    html += '</div></div></div>';

    modalHost.innerHTML = html;

    document.getElementById("closeModalBtn").onclick = closeModal;
    document.getElementById("cancelModalBtn").onclick = closeModal;

    var dropZone = document.getElementById("dropZoneBox");
    var fileInput = document.getElementById("pdfFileInput");

    dropZone.onclick = function() { fileInput.click(); };
    dropZone.ondragover = function(e) { e.preventDefault(); dropZone.style.borderColor = "var(--f5-blue-600)"; dropZone.style.background = "#EFF6FF"; };
    dropZone.ondragleave = function(e) { dropZone.style.borderColor = "#94A3B8"; dropZone.style.background = "#F8FAFC"; };
    dropZone.ondrop = function(e) {
      e.preventDefault();
      dropZone.style.borderColor = "#94A3B8";
      dropZone.style.background = "#F8FAFC";
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        uploadFile(e.dataTransfer.files[0]);
      }
    };
    fileInput.onchange = function() {
      if (fileInput.files && fileInput.files[0]) {
        uploadFile(fileInput.files[0]);
      }
    };



    function uploadFile(file) {
      closeModal();
      notifyToast("📤 Uploading " + file.name + " to validation pipeline...");
      var reader = new FileReader();
      reader.onload = function(evt) {
        var rawData = evt.target.result;
        fetch("/api/upload", {
          method: "POST",
          headers: { "X-Filename": file.name, "Content-Type": "application/pdf", "X-SOS-Portal": "1" },
          body: rawData
        })
        .then(function(r) { return r.json(); })
        .then(function(order) {
          if (order && order.id) {
            order.isLive = true;
            appState.orders = appState.orders.filter(function(x){ return x.id !== order.id; });
            appState.orders.unshift(order);
            updateApp();
            notifyToast("✨ PO #" + order.po + " ingested & validated!");
          }
        })
        .catch(function(err) {
          notifyToast("Upload notice: " + err);
        });
      };
      reader.readAsArrayBuffer(file);
    }
  }

  function triggerReturnModal(o) {
    var modalHost = document.getElementById("modalHost");
    var emailBody = "Hello " + o.from + " Order Operations,\n\nThank you for Purchase Order " + o.po + ".\n\nBefore F5 Sales Operations can proceed with booking this order, please provide clarification on the following items:\n\n";
    (o.flags || []).forEach(function(f) {
      emailBody += "  • " + f.title + ": " + f.detail + "\n";
    });
    emailBody += "\nPlease reply with the updated information or submit a revised purchase order.\n\nThank you,\nF5 Sales Operations Desk";

    var html = '<div class="modal-backdrop-blur">';
    html += '<div class="modern-modal-card" style="max-width:700px;">';
    html += '<div class="modal-header-bar" style="background:var(--f5-red-500);">';
    html += '<h3>✉️ Return to Reseller — Discrepancy Notice</h3>';
    html += '<button type="button" class="btn-close-modal" id="closeModalBtn">&times;</button>';
    html += '</div>';

    html += '<div class="modal-body-pad">';
    html += '<div style="margin-bottom:12px;font-size:12.5px;color:var(--text-muted);">';
    html += '<strong>To:</strong> <code>' + escapeHtml(o.from) + ' Order Desk</code> &bull; <strong>Subject:</strong> <code>Inquiry Regarding F5 Purchase Order #' + escapeHtml(o.po) + '</code>';
    html += '</div>';
    html += '<textarea class="modern-input" id="emailDraftArea" style="min-height:240px;font-family:monospace;font-size:12px;">' + escapeHtml(emailBody) + '</textarea>';
    html += '</div>';

    html += '<div class="modal-footer-bar">';
    html += '<button type="button" class="btn-action-outline" id="cancelModalBtn">Cancel</button>';
    html += '<button type="button" class="btn-action-outline" id="copyEmailClipboardBtn">📋 Copy to Clipboard</button>';
    html += '<button type="button" class="btn-action-primary" id="confirmReturnSubmitBtn" style="background:var(--f5-red-500);">Mark as Returned to Reseller</button>';
    html += '</div></div></div>';

    modalHost.innerHTML = html;

    document.getElementById("closeModalBtn").onclick = closeModal;
    document.getElementById("cancelModalBtn").onclick = closeModal;
    document.getElementById("copyEmailClipboardBtn").onclick = function() {
      var text = document.getElementById("emailDraftArea").value;
      navigator.clipboard.writeText(text);
      notifyToast("📋 Copied email notice to clipboard!");
    };
    document.getElementById("confirmReturnSubmitBtn").onclick = function() {
      o.status = "return";
      closeModal();
      updateApp();
      notifyToast("✉️ PO #" + o.po + " marked as Returned to Reseller.");
    };
  }

  function closeModal() {
    document.getElementById("modalHost").innerHTML = "";
  }

  // Top Nav Ingest Buttons
  var navIngestBtn = document.getElementById("navIngestModalBtn");
  if (navIngestBtn) navIngestBtn.addEventListener("click", triggerInboundUploadModal);
  var quickDropBtn = document.getElementById("quickDropBtn");
  if (quickDropBtn) quickDropBtn.addEventListener("click", triggerInboundUploadModal);

  // Sync Live Orders from Backend
  function syncLiveOrders() {
    fetch("/api/orders")
      .then(function(r) { return r.json(); })
      .then(function(liveOrders) {
        if (Array.isArray(liveOrders)) {
          var localMap = {};
          (appState.orders || []).forEach(function(existing) {
            if (existing && existing.id) {
              localMap[existing.id] = existing;
            }
          });

          liveOrders.forEach(function(lo) {
            lo.isLive = true;
            (lo.flags || []).forEach(function(f, idx) {
              if (!f.id) f.id = "flag_" + (f.rule || "item") + "_" + idx;
            });
            var prev = localMap[lo.id];
            if (prev) {
              if (Array.isArray(prev.reviewedFlags) && prev.reviewedFlags.length) {
                lo.reviewedFlags = prev.reviewedFlags;
              }
              if (prev.detailTab) {
                lo.detailTab = prev.detailTab;
              }
              if (prev.status === "booked") {
                lo.status = "booked";
                lo.booking_result = prev.booking_result;
              }
            }
            if (!lo.reviewedFlags) lo.reviewedFlags = [];
          });

          appState.orders = liveOrders;
          saveState();
          updateApp();
        }
      })
      .catch(function(err) { console.debug("API orders check: ", err); });
  }

  // Real-time Server-Sent Events (SSE) Stream
  function initLiveStream() {
    if (!window.EventSource) return;
    var evtSource = new EventSource("/api/stream");
    var banner = document.getElementById("liveIngestionBanner");
    var bannerText = document.getElementById("liveBannerText");
    var progBar = document.getElementById("liveProgressBar");
    var progFill = document.getElementById("liveProgressFill");

    if (banner) banner.style.display = "flex";

    evtSource.onmessage = function(e) {
      try {
        var msg = JSON.parse(e.data);
        if (!msg) return;

        var d = msg.data || msg;
        var stage = d.stage || msg.stage;

        if (stage === "received") {
          if (bannerText) bannerText.innerHTML = "📥 Inbound PO Received: <strong>" + escapeHtml(d.filename) + "</strong> via " + escapeHtml(d.source || "Azure Blob") + "...";
          if (progBar) progBar.style.display = "block";
          if (progFill) progFill.style.width = "25%";
          notifyToast("📥 Inbound PO: " + d.filename);
        }
        else if (stage === "extracting") {
          if (bannerText) bannerText.innerHTML = "⚙️ Extracting Header, 11 Parties &amp; Line Items for <strong>" + escapeHtml(d.filename) + "</strong>...";
          if (progFill) progFill.style.width = "50%";
        }
        else if (stage === "reconciling") {
          if (bannerText) bannerText.innerHTML = "❄️ Snowflake CPQ: Reconciling quote pricing &amp; billing account...";
          if (progFill) progFill.style.width = "75%";
        }
        else if (stage === "validating") {
          if (bannerText) bannerText.innerHTML = "📋 Evaluating 11-Item SOS Policy checklist rules &amp; Quote checks...";
          if (progFill) progFill.style.width = "90%";
        }
        else if (stage === "ready" || msg.type === "order_ready") {
          var order = (msg.data && msg.data.order) || msg.order;
          if (order) {
            order.isLive = true;
            appState.orders = appState.orders.filter(function(x){ return x.id !== order.id; });
            appState.orders.unshift(order);
            updateApp();
            if (bannerText) bannerText.innerHTML = "✨ <strong>PO #" + escapeHtml(order.po) + "</strong> from <strong>" + escapeHtml(order.from) + "</strong> validated &amp; ready for 1-Click Salesforce Booking!";
            if (progFill) progFill.style.width = "100%";
            notifyToast("✨ PO #" + order.po + " validated!");
            setTimeout(function() {
              if (progBar) progBar.style.display = "none";
              if (progFill) progFill.style.width = "0%";
            }, 4500);
          }
        }
        else if (msg.type === "order_booked") {
          var bid = msg.data && msg.data.order_id;
          var target = getOrderById(bid);
          if (target) {
            target.status = "booked";
            target.sfdcRecordId = msg.data.booking_form_id;
            target.sfdcRecordUrl = msg.data.url;
            target.pdfAttached = msg.data.pdf_attached;
            updateApp();
          }
        }
      } catch(err) {
        console.warn("SSE event parse error: ", err);
      }
    };

    evtSource.onerror = function() {
      // Periodic poll fallback
      setInterval(syncLiveOrders, 4000);
    };
  }

  // Initialize
  updateApp();
  syncLiveOrders();
  initLiveStream();
})();
</script>
